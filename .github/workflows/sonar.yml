name: SonarQube

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "sonar-project.properties"
      - ".github/workflows/sonar.yml"

# Aucun droit par defaut : chaque job declare uniquement ce dont il a besoin.
permissions: {}

# Un seul scan a la fois par ref : les pushes suivants annulent le scan en cours.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Les secrets de cet environnement sont limites a la branche main.
    environment: sonar
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        # actions/checkout v7.0.1 - epingle par SHA (pas de tag mutable)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # necessaire pour le blame et l'analyse du "new code"
          fetch-depth: 0
          # ne laisse pas le GITHUB_TOKEN dans la config git du runner
          persist-credentials: false

      - name: SonarQube Scan
        # SonarSource/sonarqube-scan-action v8.4.0 - epingle par SHA
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
